name: exchange-code
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code from OAuth Playground (4/0... or the whole URL)"
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange code for tokens
        env:
          RAWCODE: ${{ github.event.inputs.code }}
          CID: ${{ secrets.YT_CLIENT_ID }}
          CSEC: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.parse, urllib.request
          raw = os.environ["RAWCODE"].strip()
          m = re.search(r"code=([^&\s]+)", raw)
          if m:
              raw = m.group(1)
          code = urllib.parse.unquote(raw).strip().replace(" ", "")
          print("code length:", len(code), "| starts with:", code[:4])
          data = urllib.parse.urlencode({
              "code": code,
              "client_id": os.environ["CID"].strip(),
              "client_secret": os.environ["CSEC"].strip(),
              "redirect_uri": "https://mezfer.github.io/",
              "grant_type": "authorization_code",
          }).encode()
          try:
              d = json.load(urllib.request.urlopen(urllib.request.Request("https://oauth2.googleapis.com/token", data=data)))
          except urllib.error.HTTPError as e:
              d = json.loads(e.read().decode())
          if "refresh_token" in d:
              print("OK scope:", d.get("scope"))
              print("refresh_token_expires_in:", d.get("refresh_token_expires_in", "absent (permanent)"))
              print("REFRESH_TOKEN_START")
              print(d["refresh_token"])
              print("REFRESH_TOKEN_END")
          else:
              print("ERROR:", d.get("error"), "-", d.get("error_description"))
          PY
